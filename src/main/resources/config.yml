# ------------------------------------------------------------------------------
# SECTION 18: DEVELOPER PUBLIC API USAGE
# ------------------------------------------------------------------------------
# Tessera provides a clean, robust, static developer API for external plugins:
#
# // 1. Retrieve an ItemStack by custom ID:
# ItemStack stack = com.prisma.tessera.api.Tessera.getItem("ruby_sword");
#
# // 2. Verify whether an ItemStack is a Tessera custom item:
# boolean isCustom = com.prisma.tessera.api.Tessera.isCustomItem(itemStack);
#
# // 3. Get the unique string ID of a custom item:
# String id = com.prisma.tessera.api.Tessera.getCustomItemId(itemStack);
#
# // 4. Get the item template (ItemTemplate):
# ItemTemplate template = com.prisma.tessera.api.Tessera.getTemplate("ruby_sword");
#
# // 5. Check if an item ID exists in registries:
# boolean exists = com.prisma.tessera.api.Tessera.exists("ruby_ore");
#
# // 6. Get a list of all registered custom IDs:
# List<String> allIds = com.prisma.tessera.api.Tessera.getAllIds();


# ------------------------------------------------------------------------------
# SECTION 19: FREQUENTLY ASKED QUESTIONS (FAQ & TROUBLESHOOTING)
# ------------------------------------------------------------------------------
# Q1: Why are players seeing 'Resource pack download failed'?
# A1: Ensure the port configured in pack.server.port (8085) is port-forwarded
# and open in your firewall (e.g. ufw allow 8085/tcp), and that 'domain' points
# to your server's public external IP or domain name rather than 'localhost'.
#
# Q2: Does resource pack anti-unzip protection work against WinRAR and 7-Zip?
# A2: Yes! Protection Level 2 corrupts local file header path entries using directory
# traversal markers ('../../\\\\'). Standard unzippers abort extraction to prevent
# zip-slip exploits, protecting your textures from extraction.
#
# Q3: How do I reload configurations without restarting the server?
# A3: Use the command '/tessera reload'. This reloads all files from items/, blocks/,
# furniture/, recipes/, hud/, recompiles the pack, and updates the SHA-1 hash.
#
# Q4: How do I create custom armor with unique models?
# A4: Create an item file in items/ using LEATHER_CHESTPLATE (or similar) with
# custom_model_data or modern Paper armor trim components.
#
# Q5: Is Tessera compatible with Bedrock players via GeyserMC?
# A5: Yes! Tessera generates standard Java model assets. For Bedrock edition clients,
# GeyserOptionalPack or an automated resource pack converter can be used.
#
# Q6: Why do some custom items show up as purple and black checkerboards?
# A6: Verify that the texture path in your model JSON matches the real file path
# inside pack/assets/tessera/textures/. Note that file paths in Linux are case-sensitive!


