# ------------------------------------------------------------------------------
# SECTION 14: PERMISSIONS REFERENCE TABLE
# ------------------------------------------------------------------------------
# Full reference table of all Tessera permission nodes for LuckPerms:
#
# • tessera.admin        - Full access to all administrative commands (/tessera reload, give, pack, welcome)
# • tessera.user.give    - Permission to take custom items via command or clicking in the GUI catalog
# • tessera.command.menu - Permission to open the interactive GUI item catalog (/tessera menu)
# • tessera.command.hud  - Permission to toggle personal on-screen HUD (/tessera hud)
# • tessera.command.info - Permission to view engine system information (/tessera info)
# • tessera.pack.bypass  - Permission to bypass mandatory server resource pack prompt


# ------------------------------------------------------------------------------
# SECTION 15: MIGRATION GUIDE FROM LEGACY CUSTOM ITEM PLUGINS
# ------------------------------------------------------------------------------
# How to migrate your assets and configs to Tessera:
#
# 1. ITEMS (items/):
#    - Place item textures into pack/assets/tessera/textures/item/
#    - Place 3D model JSONs into pack/assets/tessera/models/item/
#    - Create item YAML files in items/ following the template below.
#
# 2. BLOCKS (blocks/):
#    - Define base material, display name, mining hardness, and required tool tier.
#    - Configure custom sound groups in sound_group.
#    - Place block YAML files into blocks/.
#
# 3. FURNITURE (furniture/):
#    - Use display_type: ITEM_DISPLAY for maximum performance on Paper 1.21.11.
#    - Configure seat: enabled: true with vertical Y offset for comfortable sitting.
#    - Place furniture YAML files into furniture/.
#
# 4. FONTS & GLYPHS (glyphs/):
#    - Place PNG icons into pack/assets/tessera/textures/font/
#    - Define glyph YAML configurations in glyphs/ specifying height and ascent.
#
# 5. RECIPES (recipes/):
#    - Supported recipe formats include SHAPED (3x3 grid), SHAPELESS (crafting grid),
#      FURNACE (smelting), BLASTING, SMOKER, and CAMPFIRE cooking.


# ------------------------------------------------------------------------------
# SECTION 16: ADVANCED COMBAT & TOOL MECHANICS
# ------------------------------------------------------------------------------
# Tessera provides expandable mechanics for legendary equipment:
#
# 1. LifeSteal:
#    Restores a percentage of dealt damage back to the attacker's health.
#
# 2. Explosive Strike:
#    Creates a safe or destructive explosion around the target entity upon strike.
#
# 3. Thunder Strike:
#    Summons a lightning strike on critical hits or projectile impact.
#
# 4. Poison / Bleed:
#    Applies periodic bleeding or toxicity damage to the target.
#
# 5. Custom Projectiles (Bows & Crossbows):
#    Allows customizing projectile velocity, gravity scaling, and trail particle effects.


