prefix: "<gradient:#00c6ff:#0072ff><bold>Tessera</bold></gradient> <dark_gray>»</dark_gray> "

messages:
  no_permission: "<red>No tienes permiso para ejecutar este comando.</red>"
  unknown_command: "<red>Subcomando desconocido. Usa <yellow>/tessera info</yellow> para ayuda.</red>"
  reload_success: "<green>¡Todas las configuraciones, objetos, bloques y recetas se han recargado!</green>"
  player_only: "<red>Este comando solo puede ser ejecutado por un jugador.</red>"
  player_not_found: "<red>Jugador no encontrado: <yellow>%target%</yellow></red>"
  item_not_found: "<red>Objeto personalizado no encontrado: <yellow>%id%</yellow></red>"
  item_given: "<green>Entregado <yellow>%amount%x %id%</yellow> a <aqua>%player%</aqua>.</green>"
  hud_enabled: "<green>Tu HUD en pantalla ha sido activado.</green>"
