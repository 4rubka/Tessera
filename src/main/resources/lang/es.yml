  furniture_in_use: "<yellow>¡Este asiento ya está ocupado!</yellow>"

pack:
  prompt: |
    <gradient:#00c6ff:#0072ff><bold>Paquete de Recursos del Servidor</bold></gradient>
    <gray>Por favor, acepta el paquete de recursos para ver armas 3D,</gray>
    <gray>muebles interactivos y bloques personalizados.</gray>
  loading_title: "<gradient:#00c6ff:#0072ff><bold>Tessera</bold></gradient>"
  loading_subtitle: "<gray>Cargando paquete de recursos, por favor espera...</gray>"
  loaded_actionbar: "<green>✔ ¡Paquete de recursos cargado con éxito!</green>"
  loaded_chat: "<gradient:#00c6ff:#0072ff><b>Tessera</b></gradient> <dark_gray>»</dark_gray> <green>¡Paquete de recursos activo! Disfruta del juego.</green>"
  kick_declined: |
    <gradient:#ff416c:#ff4b2b><bold>Paquete de Recursos Obligatorio</bold></gradient>
    
    <gray>Debes aceptar el paquete de recursos para jugar en este servidor.</gray>
    <gray>Actívalo en: <b>Multijugador</b> -> <b>Editar Servidor</b> -> <b>Paquetes de Recursos: Sí</b>.</gray>
  kick_failed: |
    <gradient:#ff416c:#ff4b2b><bold>Error en la descarga</bold></gradient>
    
    <gray>No se pudo descargar el paquete de recursos a tu cliente.</gray>
    <gray>Verifica tu conexión a internet e inténtalo de nuevo.</gray>
  declined_warning: "<yellow>⚠ Has rechazado el paquete de recursos.</yellow>"
  failed_warning: "<red>⚠ Error al descargar el paquete de recursos.</red>"

gui:
  title: "<gradient:#00c6ff:#0072ff><bold>Catálogo Tessera</bold></gradient>"
